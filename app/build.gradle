plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mixcasete.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mixcasete.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}

dependencies {
    // Revertido: BravePipeExtractor entregaba una URL "válida" (el título/portada
    // cambiaban) pero sin audio real con el MediaPlayer nativo de Android.
    // Se vuelve a la versión original que sí reproducía correctamente.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:dev-SNAPSHOT'
}
